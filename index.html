<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANMC 2026 — Registration Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#12356b; --gold:#b8922f; --bg:#f4f6fb; --line:#dce3ef;
    --txt:#1b2433; --muted:#5c6b82; --ok:#2f7d3a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  header{background:var(--navy);color:#fff;padding:18px 22px}
  header h1{margin:0;font-size:19px;letter-spacing:.3px}
  header p{margin:4px 0 0;font-size:13px;opacity:.85}
  .wrap{max-width:1040px;margin:22px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(18,53,107,.05)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  input:focus{outline:none;border-color:var(--navy)}
  button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:11px 18px}
  .primary{background:var(--navy);color:#fff}
  .primary:disabled{opacity:.5;cursor:default}
  .excel{background:var(--ok);color:#fff}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .msg{font-size:13px;margin-top:10px;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--ok)}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 2px}
  .stat{flex:1;min-width:150px;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:14px}
  .stat b{display:block;font-size:26px;color:var(--navy)}
  .stat span{font-size:12px;color:var(--muted)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
  th{background:#eef2fa;color:var(--navy);position:sticky;top:0}
  .scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .free{background:#e6f4ea;color:var(--ok)}
  .paid{background:#fdecea;color:var(--red)}
  .hide{display:none}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}

  /* ---- layout + tracker ---- */
  .layout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .trackerCol{flex:0 0 250px;max-width:280px}
  .reportCol{flex:1;min-width:320px}
  @media(max-width:760px){ .trackerCol{flex:1 1 100%;max-width:none} }
  .tkTitle{font-size:14px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:2px}
  .tkSub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px}
  .tank{position:relative;width:150px;height:300px;margin:0 auto 14px;
    border:3px solid #a9c2e3;border-radius:18px/12px;overflow:hidden;
    background:linear-gradient(90deg,#eaf1fb,#f7fafe 30%,#eef4fc);box-shadow:inset 0 2px 8px rgba(18,53,107,.08)}
  .tank .liquid{position:absolute;left:0;right:0;bottom:0;height:0;
    background:linear-gradient(180deg,#5bb6f7,#1f78c8);transition:height 1.1s cubic-bezier(.22,1,.36,1)}
  .tank .liquid::before{content:"";position:absolute;top:-10px;left:0;right:0;height:14px;border-radius:50%;background:#6cc0f8;opacity:.9}
  .tank .ticks{position:absolute;inset:0;pointer-events:none}
  .tank .ticks i{position:absolute;left:0;right:0;height:1px;background:rgba(18,53,107,.12)}
  .tkPctBig{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
    font-size:22px;font-weight:800;color:#0d2b57;text-shadow:0 1px 2px rgba(255,255,255,.7);z-index:2}
  .tkNums{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
  .tkBox{flex:1;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .tkBox b{display:block;font-size:20px;color:var(--navy)}
  .tkBox span{font-size:11px;color:var(--muted)}
  .tgtRow{margin-top:12px}
  .tgtRow label{margin:0 0 4px}
</style>
</head>
<body>
<header>
  <h1>ANMC 2026 — Registration Report</h1>
  <p>6th Arab Nurses &amp; Midwives Conference · Read-only registration export</p>
</header>

<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <label>Email</label>
    <input id="email" type="email" value="SALTameemi@hamad.qa" autocomplete="username">
    <label>Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Supabase account password">
    <div class="row" style="margin-top:14px">
      <button class="primary" id="loginBtn" onclick="login()">Sign in</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- REPORT + TRACKER -->
  <div class="layout hide" id="layout">

  <!-- TRACKER -->
  <div class="card trackerCol">
    <div class="tkTitle">Paying Participants</div>
    <div class="tkSub">Progress toward target</div>
    <div class="tank">
      <div class="ticks"><i style="top:25%"></i><i style="top:50%"></i><i style="top:75%"></i></div>
      <div class="liquid" id="liquid"></div>
      <div class="tkPctBig" id="tkPct">0%</div>
    </div>
    <div class="tkNums">
      <div class="tkBox"><b id="tkCur">0</b><span>Registered</span></div>
      <div class="tkBox"><b id="tkRem">0</b><span>Remaining</span></div>
    </div>
    <div class="tgtRow">
      <label>Target</label>
      <input id="target" type="number" min="1" value="800" oninput="updateTracker()">
    </div>
  </div>

  <!-- REPORT -->
  <div class="card reportCol" id="reportCard">
    <div class="row" style="justify-content:space-between">
      <div>
        <button class="primary" id="loadBtn" onclick="loadData()">Load registrations</button>
        <button class="excel" id="xlsBtn" onclick="exportExcel()" disabled>Download Excel (3 sheets)</button>
      </div>
      <button onclick="logout()" style="background:#eef2fa;color:var(--navy)">Sign out</button>
    </div>
    <div class="msg" id="loadMsg"></div>

    <div class="stats hide" id="stats"></div>

    <div class="tabs hide" id="tabs" style="margin-top:14px">
      <div class="tab active" data-g="Participants" onclick="showTab('Participants')">Participants</div>
      <div class="tab" data-g="Members" onclick="showTab('Members')">Members</div>
      <div class="tab" data-g="Guests &amp; Others" onclick="showTab('Guests &amp; Others')">Guests &amp; Others</div>
    </div>

    <div class="scroll hide" id="tableWrap"><div id="tableBox"></div></div>
  </div>

  </div><!-- /layout -->

</div>

<script>
/* ---------- CONFIG ---------- */
const SUPABASE_URL  = "https://xmdkvxzflbbdnkwsggjm.supabase.co";
const SUPABASE_ANON = "sb_publishable_5UXQ_sYU5KOnRob11-ic1g_VtjUhXP8";
const REG_TABLE     = "registrations";

/* ---------- STATE ---------- */
let TOKEN = null;
let ROWS  = [];
let GROUPS = {"Participants":[], "Members":[], "Guests & Others":[]};
let CUR = "Participants";

/* ---------- HELPERS ---------- */
function msg(id,t,cls){const e=document.getElementById(id);e.textContent=t;e.className="msg"+(cls?" "+cls:"");}
async function sb(path,opts={}){
  opts.headers = Object.assign({
    "apikey": SUPABASE_ANON,
    "Authorization": "Bearer " + (TOKEN||SUPABASE_ANON),
    "Content-Type":"application/json"
  }, opts.headers||{});
  const r = await fetch(SUPABASE_URL+"/"+path, opts);
  return r;
}

/* ---------- AUTH ---------- */
async function login(){
  const email=document.getElementById("email").value.trim();
  const pass=document.getElementById("pass").value;
  if(!email||!pass){msg("loginMsg","Enter email and password.","err");return;}
  document.getElementById("loginBtn").disabled=true;
  msg("loginMsg","Signing in…");
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({email,password:pass})
    });
    const d=await r.json();
    if(!r.ok){throw new Error(d.error_description||d.msg||"Login failed");}
    TOKEN=d.access_token;
    document.getElementById("loginCard").classList.add("hide");
    document.getElementById("layout").classList.remove("hide");
    msg("loginMsg","");
  }catch(e){
    msg("loginMsg",e.message,"err");
    document.getElementById("loginBtn").disabled=false;
  }
}
function logout(){
  TOKEN=null;ROWS=[];
  document.getElementById("layout").classList.add("hide");
  document.getElementById("loginCard").classList.remove("hide");
  document.getElementById("loginBtn").disabled=false;
  document.getElementById("pass").value="";
}

/* ---------- LOAD (paged) ---------- */
async function fetchAll(){
  const page=1000; let from=0; let all=[];
  while(true){
    const r=await sb(`rest/v1/${REG_TABLE}?select=*&order=created_at.asc`,{
      headers:{"Range-Unit":"items","Range":`${from}-${from+page-1}`}
    });
    if(!r.ok){const t=await r.text();throw new Error("Load error: "+t);}
    const chunk=await r.json();
    all=all.concat(chunk);
    if(chunk.length<page) break;
    from+=page;
  }
  return all;
}

function groupOf(cat){
  const c=(cat||"").trim().toLowerCase();
  if(c==="participant") return "Participants";
  if(c==="member")      return "Members";
  return "Guests & Others"; // Speaker, Guest (VIP/Regular), Complimentary, anything else
}

async function loadData(){
  document.getElementById("loadBtn").disabled=true;
  document.getElementById("xlsBtn").disabled=true;
  msg("loadMsg","Loading… please wait");
  try{
    ROWS=await fetchAll();
    GROUPS={"Participants":[], "Members":[], "Guests & Others":[]};
    ROWS.forEach(r=>GROUPS[groupOf(r.category)].push(r));
    renderStats();
    updateTracker();
    showTab(CUR);
    document.getElementById("stats").classList.remove("hide");
    document.getElementById("tabs").classList.remove("hide");
    document.getElementById("tableWrap").classList.remove("hide");
    document.getElementById("xlsBtn").disabled=false;
    msg("loadMsg","Loaded "+ROWS.length+" registrations.","ok");
  }catch(e){
    msg("loadMsg",e.message,"err");
  }
  document.getElementById("loadBtn").disabled=false;
}

/* ---------- RENDER ---------- */
function renderStats(){
  const s=document.getElementById("stats");
  s.innerHTML="";
  const collected=ROWS.filter(r=>r.badge_collected===true||r.badge_collected==="true").length;
  const items=[
    ["Total", ROWS.length],
    ["Participants", GROUPS["Participants"].length],
    ["Members", GROUPS["Members"].length],
    ["Guests & Others", GROUPS["Guests & Others"].length],
    ["Badges Collected", collected+" / "+ROWS.length]
  ];
  items.forEach(([lbl,n])=>{
    const d=document.createElement("div");d.className="stat";
    d.innerHTML=`<b>${n}</b><span>${lbl}</span>`;
    s.appendChild(d);
  });
}

/* ---------- TRACKER ---------- */
function updateTracker(){
  const t=document.getElementById("target");
  const target=Math.max(1, parseInt(t&&t.value)||800);
  const current=GROUPS["Participants"].length;          // paying participants
  const pct=Math.min(100, current/target*100);
  const liquid=document.getElementById("liquid");
  if(liquid) liquid.style.height=pct+"%";
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set("tkPct", (pct>=100?100:pct.toFixed(1))+"%");
  set("tkCur", current);
  set("tkRem", Math.max(0, target-current));
}

const COLS=[
  ["registrant_id","Registration ID"],
  ["full_name","Full Name"],
  ["qid","QID"],
  ["licence_no","Licence"],
  ["email","Email"],
  ["mobile","Phone"],
  ["position_role","Position/Role"],
  ["organization","Facility/Organization"],
  ["category","Category"],
  ["guest_type","Guest Type"],
  ["attendance_mode","Attendance"],
  ["fees","Fees"],
  ["__amount","Amount Paid"],
  ["badge_collected","Badge Collected"],
  ["badge_collected_at","Collected At"]
];
function fmtDate(v){ if(!v) return ""; const d=new Date(v); if(isNaN(d)) return String(v);
  return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

// candidate DB columns that may hold a manual paid amount (override, first non-empty wins)
const AMOUNT_KEYS=["amount_paid","amount","paid_amount","payment_amount","fee_amount","payment"];
// Participant fee: 200 onsite / 150 online
const FEE_ONSITE=200, FEE_ONLINE=150;
function amountOf(r){
  // 1) manual value in DB wins
  for(const k of AMOUNT_KEYS){ if(r[k]!=null && String(r[k]).trim()!=="") return r[k]; }
  // 2) only paying categories get an amount
  const fee=(r.fees||"").toLowerCase();
  if(fee.includes("free")) return 0;
  const cat=(r.category||"").trim().toLowerCase();
  if(cat==="participant"){
    const mode=(r.attendance_mode||"").toLowerCase();
    return (mode.includes("online")||mode.includes("virtual")) ? FEE_ONLINE : FEE_ONSITE;
  }
  // non-participant non-free: unknown → blank
  return fee.includes("paid") ? FEE_ONSITE : 0;
}

function showTab(g){
  CUR=g;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.g===g));
  const rows=GROUPS[g]||[];
  let h="<table><thead><tr>";
  COLS.forEach(c=>h+=`<th>${c[1]}</th>`);
  h+="</tr></thead><tbody>";
  if(!rows.length){h+=`<tr><td colspan="${COLS.length}" style="text-align:center;color:#888">No records</td></tr>`;}
  rows.forEach(r=>{
    h+="<tr>";
    COLS.forEach(c=>{
      let v;
      if(c[0]==="__amount") v=String(amountOf(r));
      else if(c[0]==="badge_collected") v = (r[c[0]]===true||r[c[0]]==="true") ? '<span class="pill free">✓ Yes</span>' : '<span class="pill" style="background:#f1f3f6;color:#888">No</span>';
      else if(c[0]==="badge_collected_at") v = fmtDate(r[c[0]]);
      else v = (r[c[0]]==null?"":String(r[c[0]]));
      if(c[0]==="fees"){
        const f=v.toLowerCase();
        const cls=f.includes("free")||f===""?"free":"paid";
        v=`<span class="pill ${cls}">${v||"—"}</span>`;
      }
      h+=`<td>${v}</td>`;
    });
    h+="</tr>";
  });
  h+="</tbody></table>";
  document.getElementById("tableBox").innerHTML=h;
}

/* ---------- EXCEL ---------- */
function sheetData(rows){
  const head=COLS.map(c=>c[1]);
  const body=rows.map(r=>COLS.map(c=>{
    if(c[0]==="__amount") return amountOf(r);
    if(c[0]==="badge_collected") return (r[c[0]]===true||r[c[0]]==="true")?"Yes":"No";
    if(c[0]==="badge_collected_at") return fmtDate(r[c[0]]);
    return r[c[0]]==null?"":r[c[0]];
  }));
  return [head,...body];
}
function exportExcel(){
  const wb=XLSX.utils.book_new();
  [["Participants","Participants"],["Members","Members"],["Guests & Others","Guests & Others"]].forEach(([g,name])=>{
    const ws=XLSX.utils.aoa_to_sheet(sheetData(GROUPS[g]));
    ws["!cols"]=COLS.map(()=>({wch:18}));
    XLSX.utils.book_append_sheet(wb,ws,name);
  });
  const d=new Date();
  const stamp=d.toISOString().slice(0,10);
  XLSX.writeFile(wb,`ANMC2026_Registration_Report_${stamp}.xlsx`);
}
</script>
</body>
</html>
